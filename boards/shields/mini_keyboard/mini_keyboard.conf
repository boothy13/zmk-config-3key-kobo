# ZMK Studio Support
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y

# Bluetooth Configuration
CONFIG_ZMK_BLE=y
CONFIG_ZMK_KEYBOARD_NAME="Page Turner"
# Standard HID keyboard appearance (0x03C1).
CONFIG_BT_DEVICE_APPEARANCE=961

# Kobo fix: stock ZMK only accepts LE Secure Connections pairing. The Kobo's
# Bluetooth stack may only offer legacy pairing, so allow it (hosts that support
# Secure Connections, like phones and PCs, still use it).
# Provided by zmk-patches/0001-ble-allow-legacy-pairing.patch.
CONFIG_ZMK_BLE_ALLOW_LEGACY_PAIRING=y

# ZMK's documented fix for hosts that connect but behave badly: disables the
# 2M PHY and uses more conservative connection parameters.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Support multiple connections
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# Pin 9 NFC Reassignment (Mandatory for this hardware)
CONFIG_NFCT_PINS_AS_GPIOS=y

# Battery saving settings
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Android compatibility for consumer keys (volume, media)
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y
