manifest:
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    # Stock upstream ZMK, pinned to the same release as the build workflow.
    # Kobo-specific changes live in ../zmk-patches and are applied by
    # .github/workflows/build.yml after `west update`.
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      import: app/west.yml
  self:
    path: config
