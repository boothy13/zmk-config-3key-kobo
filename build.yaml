# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  - board: nice_nano
    shield: mini_keyboard
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: mini_keyboard_with_studio
  - board: nice_nano
    shield: settings_reset
    artifact-name: nice_nano_settings_reset
  # --- Kobo discovery experiments (see CHANGELOG.md). Each one drops a single
  # piece of the BLE advertisement so we can see which one the Kobo rejects.
  - board: nice_nano
    shield: mini_keyboard
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_BLE_ADV_APPEARANCE=n -DCONFIG_ZMK_BLE_ADV_SERVICE_UUIDS=n
    artifact-name: kobo_test_A_bare_name_only
  - board: nice_nano
    shield: mini_keyboard
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_BLE_ADV_APPEARANCE=n
    artifact-name: kobo_test_B_no_appearance
  - board: nice_nano
    shield: mini_keyboard
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_BLE_ADV_SERVICE_UUIDS=n
    artifact-name: kobo_test_C_no_service_uuids
  - board: nice_nano
    shield: mini_keyboard
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_BLE_ADV_NAME_IN_SCAN_RSP=y
    artifact-name: kobo_test_D_name_in_scan_response
  - board: nice_nano
    shield: mini_keyboard
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_BLE_IDENTITY_ADDR=\"F2:4B:1E:7A:33:C5\"
    artifact-name: kobo_test_E_new_address
  - board: nice_nano
    shield: mini_keyboard
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_BT_CTLR_TX_PWR_PLUS_8=y
    artifact-name: kobo_test_F_max_tx_power
